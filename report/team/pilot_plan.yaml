# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a) · nhóm botusieudang · L3A
# Số có nhãn [simulated] tính từ cột *_simulated của dữ liệu chạy thử (giả lập). Số D1 do src/lab13.py tính.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels Cohen h: 1.250)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm
#      → 42 nhân viên mỗi nhóm, tổng 84 > 40: KHÔNG ĐỦ NGƯỜI
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251: KHÔNG ĐẠT
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa = 6 / 0,02 = 300 (và chỉ 6 cụm < 20)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm:
#      20m / (1 + (m − 1) × 0,02) ≥ 859 → 2,82m ≥ 841,82 → m ≥ 299 yêu cầu mỗi người (DE 6,96)
#      Khả thi: ~30,7 yêu cầu trong phạm vi / người / ngày → ~10 ngày làm việc ở bước 0.50
#
# D2 · Năm câu kiểm tra "tách được tác động" (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên bằng code, seed 20261207 ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; quyền truy cập theo tài khoản, log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này và ký trước 2026-12-04.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm.
#
# Đánh đổi đã chấp nhận: 40 nhân viên không đủ để thấy mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Chọn MDE 6 điểm; nếu tác động thật chỉ 5 điểm thì power còn ≈ 0,64 (NormalIndPower, n = 859).
#   Giám đốc vận hành ký chấp nhận con số này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn bộ 4,25% (51/1.200); phạm vi noi_dia + hang_nang 3,97% (39/982); noi_dia 3,16%, hang_nang 8,23%.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu → chọn: cao hơn đối chứng ≥ 2 điểm HOẶC vượt trần 6%.
#   hang_nang đã 8,23% > 6% → trần 6% tính trên cả phạm vi, hang_nang chỉ so với đối chứng của chính nó.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: >-
    Chỉ yêu cầu loại noi_dia và hang_nang, ở cả 12 depot (vì chia theo nhân viên).
    Lý do bằng số (A3): noi_dia 0,22× và hang_nang 0,69× so với 12.000 đ [simulated];
    loại quoc_te (1,88× [simulated], thành công 27,3%, lần chạy 3 chỉ đúng 2,2%)
    và doi_tac (0,85× [simulated], có điều khoản riêng).
    Trong phạm vi: 3.414 đ mỗi việc thành công = 0,28× [simulated]; cộng cố định 40 triệu/tháng: 4.599 đ = 0,38× [simulated].
  max_lan_chay: 2            # B3: giới hạn 2 lần rẻ nhất cho cả hệ thống (6.901.220 đ [simulated])

  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    method: >-
      Bốc thăm bằng code (numpy, seed = 20261207 ghi trước), phân tầng theo depot:
      trong mỗi depot chia đôi nhân viên vào nhóm trợ lý / đối chứng.
      Yêu cầu được giao cho nhân viên theo luồng phân việc hiện tại, không đổi.
    clusters: "40 nhân viên CSKH → 20 cụm nhóm trợ lý, 20 cụm nhóm đối chứng"

  rollout: [0.10, 0.25, 0.50]   # 4 → 10 → 20 nhân viên dùng trợ lý; mỗi bước 1 tuần
  rollout_schedule:
    - {share: 0.10, start: "2026-12-07", purpose: "kiểm tra event, an toàn; không đo chỉ số chính"}
    - {share: 0.25, start: "2026-12-14", purpose: "giảm xem lại theo bậc; không đo chỉ số chính"}
    - {share: 0.50, start: "2026-12-21", purpose: "giai đoạn đo chỉ số chính: 20 trợ lý vs 20 đối chứng"}

  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    definition: "Số yêu cầu đóng trong 24 giờ VÀ không mở lại trong 7 ngày ÷ tổng số yêu cầu của nhóm"
    baseline: 0.70
    mde: 0.06                   # ĐÁNH ĐỔI ĐÃ CHẤP NHẬN: 40 nhân viên không đủ để thấy mức 0,05 (xem sample_size_notes)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859              # hiệu dụng, mức chênh 6 điểm
    design_effect: 6.96         # 1 + (299 − 1) × 0,02
    clusters_per_arm: 20
    requests_per_staff_min: 299 # ≈ 10 ngày làm việc ở bước 0.50 (~30,7 yêu cầu trong phạm vi / người / ngày)
    analysis: "So hai tỉ lệ, sai số chuẩn theo cụm staff_id (cluster-robust); phân tích theo nhóm được bốc thăm (intention-to-treat)"

  sample_size_notes:
    a_by_request: "1.251 yêu cầu mỗi nhóm (mức 5 điểm) — đủ mẫu nhưng tràn tác động cao, loại"
    b_by_staff_m75: "DE 2,48 → 3.103 mỗi nhóm → 42 nhân viên mỗi nhóm, tổng 84 > 40: không đủ người"
    c_by_staff_20: "Tối đa 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm"
    d_by_depot_6: "Tối đa 6 / 0,02 = 300; chỉ 6 cụm < 20: loại"
    e_mde_6pts: "859 mỗi nhóm; 20 người mỗi nhóm cần m ≥ 299 yêu cầu/người (DE 6,96) → phương án chọn"
    adverse_number: "Nếu tác động thật chỉ 5 điểm, power chỉ còn ≈ 0,64 (statsmodels NormalIndPower, n = 859). Giám đốc vận hành ký chấp nhận trước ngày bắt đầu."

  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng luồng phân việc với 20 nhân viên dùng trợ lý"
    randomized_not_chosen: "Ngẫu nhiên bằng code, seed ghi trước, phân tầng theo depot; quản lý không được chọn người"
    spillover_risk: >-
      Có rủi ro nhân viên đối chứng xin câu trả lời của trợ lý từ đồng nghiệp cùng depot.
      Giảm bằng: quyền truy cập trợ lý theo tài khoản; log mọi lượt mở trợ lý theo staff_id
      (lượt mở từ tài khoản đối chứng = vi phạm, báo Trưởng nhóm CSKH); nhắc quy tắc trong buổi họp đầu ca.
    predeclared: "Có: chỉ số chính, MDE 0,06, ngưỡng, luật dừng và ngày quyết định chốt trong file này, ký trước 2026-12-04"
    clusters_per_arm_at_least_20: "Có: đúng 20 cụm mỗi nhóm"

  secondary_metrics:
    usage: "Tỉ lệ bỏ qua gợi ý = (sua + bo) ÷ số được xem lại; đợt chạy thử 27,12% (48/177)"
    safety: "Tỉ lệ mở lại trong 7 ngày; đợt chạy thử 4,25% toàn bộ, 3,97% trong phạm vi (noi_dia 3,16%, hang_nang 8,23%)"
    cost: "Chi phí mỗi việc thành công tính lại mỗi tuần từ trace + phút đo thật"
    rework_rate: "Tỉ lệ làm lại trong phạm vi; đợt chạy thử 4,9%"

  stop_rules:
    # An toàn — ngưỡng tương đối so với đối chứng + trần tuyệt đối; KHÔNG dùng 3% vì tỉ lệ hiện tại đã 3,97%
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng ≥ 2 điểm, hoặc vượt 6% (trong phạm vi), hoặc có ≥ 1 ca hoàn trùng / báo 'đã hoàn' khi sổ cái lỗi TRONG 3 ngày liên tiếp (riêng ca hoàn trùng: ngay lập tức) THÌ Giám đốc vận hành bật cờ tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà 20 trace trong 24 giờ KHÔNG THÌ không được sang bước rollout tiếp theo"
    # Chi phí
    - "NẾU chi phí mỗi việc thành công trong phạm vi > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về chỉ noi_dia và giữ giới hạn 2 lần chạy KHÔNG THÌ không được mở lại hang_nang"
    # Mức độ sử dụng
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và PM sửa luồng gợi ý KHÔNG THÌ không được chuyển bước rollout"
    # Chi phí xem lại (từ B4)
    - "NẾU % yêu cầu phải xem lại còn > 50% khi kết thúc bước 0.25 THÌ Trưởng nhóm CSKH giữ nguyên bước 0.25 thêm 1 tuần và áp quy tắc giảm xem lại theo bậc KHÔNG THÌ không được báo cáo tiết kiệm chi phí cho hội đồng"

  review_reduction: >-
    Tuần 1 xem lại 100% (B4: 0,98×, hoặc 1,03× với phút làm lại thật [simulated], không tiết kiệm).
    Đo phút xem lại thật; mục tiêu mỗi lần xem lại ≤ 4,8 phút (mức hoà vốn [simulated]).
    Giảm theo bậc 100% → 50% → 20% → 10% kiểm tra mẫu, mỗi bậc chỉ khi tỉ lệ sua + bo của bậc trước < 15%
    và không có ca vi phạm luật an toàn. Người quyết định: Trưởng nhóm CSKH.

  interim_looks: "Chỉ kiểm tra chỉ số an toàn và chi phí, hằng ngày; KHÔNG nhìn chỉ số chính trước 2027-01-12 để tránh dừng sớm do may rủi"
  rollback: "Giám đốc vận hành (dự phòng: Kỹ sư trưởng agent) bật cờ tắt trợ lý trong console; có hiệu lực trong 30 phút; mọi yêu cầu mới quay về luồng nhân viên tự làm, yêu cầu đang dở được chuyển kèm tóm tắt"
  decision_date: "2027-01-14"   # đo 10 ngày làm việc từ 2026-12-21 (nghỉ 01/01) + 7 ngày chờ cửa sổ mở lại
  decision_rule: >-
    Mở rộng nếu chỉ số chính nhóm trợ lý − đối chứng ≥ 0,06 với p < 0,05 và không luật dừng nào kích hoạt;
    nếu chênh dương nhưng không có ý nghĩa thống kê → kéo dài 2 tuần hoặc No-go, ghi rõ power 0,64 ở mức 5 điểm.
  decision_maker: "Giám đốc vận hành LogiX-VN"

  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút) và phut_lam_lai_simulated (1.132 phút) của đợt chạy thử"
    - "Chi phí mỗi việc thành công 4.472 đ toàn bộ, 3.414 đ trong phạm vi [simulated]"
    - "Chi phí theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ [simulated]"
    - "Bảng độ nhạy B1/B2: làm lại ×2 +51,8%, xem lại ×2 +40,7%, lương +25% → +23,1% [simulated]"
    - "B3: chi phí cả hệ thống 6.901.220 đ ở giới hạn 2 lần [simulated]"
    - "B4: xem lại 100% → 11.743 đ = 0,98× (12.415 đ = 1,03× nếu làm lại 15,3 phút như dữ liệu) [simulated]; hoà vốn khi mỗi lần xem lại ≤ 4,8–5,1 phút"
    - "A4: cộng cố định 40 triệu/tháng → 4.599 đ = 0,38× ở 45.000 yc/tháng; 5.784 đ = 0,48× nếu khối lượng còn một nửa [simulated]"
    - "So với 12.000 đ theo chi phí cả hệ thống: 5.865 đ/yêu cầu = 0,49× [simulated]"
    - "Ngưỡng chi phí 8.000 đ trong luật dừng dựa trên số [simulated]"
    - "Giả định của đề: baseline 0,70; ICC 0,02; giá token, tool, lương 2.000 đ/phút"
  replace_simulated_by: "Sau tuần 1 (2026-12-14), thay phút simulated bằng phut_xem_lai / phut_lam_lai đo thật từ event staff_review_decision và staff_rework_completed; tính lại bảng chi phí"
